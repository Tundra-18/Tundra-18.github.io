<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 350px;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d6336c;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #444;
            line-height: 1.5;
        }

        .heart {
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="love.jpeg" alt="For You">
    <h1>My Love ❤️</h1>
    <p>
        Every day with you feels special.  
        This little QR code can’t show how much you mean to me,  
        but I hope it makes you smile 😊
    </p>
    <div class="heart">💖💖💖</div>
</div>

</body>
</html>
